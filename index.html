<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="汉学课堂 — Chinese Learning Classroom. Structured HSK courses, vocabulary, practice, and an AI tutor.">
  <meta name="theme-color" content="#1677FF">
  <title>汉学课堂 · Chinese Learning Classroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Top navbar (Spec §11) -->
    <header class="nav" id="nav">
      <div class="nav-brand" id="navBrand">
        <div class="nav-logo">中</div>
        <div class="nav-title" id="navTitle"><span class="cn">汉学</span>课堂</div>
      </div>
      <nav class="nav-links" id="navLinks"></nav>
      <div class="nav-search">
        <span class="ic">🔍</span>
        <input type="search" id="navSearch" placeholder="Search courses, lessons, vocabulary…" autocomplete="off">
      </div>
      <div class="nav-right">
        <select class="lang-select" id="langSelect" title="Interface language" aria-label="Interface language"></select>
        <button class="nav-ic-btn" id="themeBtn" title="Theme">🌙</button>
        <div class="nav-user" id="navUser" style="display:none">
          <span class="ui-avatar" id="navAv">?</span>
          <span class="nm" id="navName"></span>
        </div>
        <button class="nav-ic-btn" id="signInBtn" title="Sign in">👤</button>
      </div>
    </header>

    <!-- Routed content -->
    <main class="main" id="view" aria-live="polite"></main>

    <!-- Mobile bottom nav (Spec §11) -->
    <nav class="bottom-nav" id="bottomNav"></nav>

    <footer class="site-foot" id="siteFoot">
      <div class="foot-inner">
        <div class="foot-made">Made by <strong>Yaseen Zehri</strong> with love ❤️</div>
        <div class="foot-copy">© 2028 汉学课堂 · All rights reserved.</div>
      </div>
    </footer>
  </div>

  <!-- Auth overlay (Spec §77) -->
  <div class="auth-overlay" id="authOverlay" role="dialog" aria-modal="true" aria-label="Sign in">
    <div class="auth-card">
      <div class="auth-brand"><div class="nav-logo">中</div></div>
      <h2 class="auth-title"><span class="cn">汉学</span>课堂</h2>
      <p class="auth-sub" id="authSub">Sign in to save your progress.</p>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" id="tabLogin">Sign in</button>
        <button class="auth-tab" data-tab="register" id="tabRegister">Create account</button>
      </div>
      <div class="auth-alert" id="authAlert" role="alert"></div>
      <form class="auth-form" id="authForm" autocomplete="on">
        <label class="auth-label" id="nameLabel" style="display:none">Display name
          <input class="auth-input" id="authName" type="text" autocomplete="name" maxlength="40" placeholder="How should we call you?">
        </label>
        <label class="auth-label">Username
          <input class="auth-input" id="authUser" type="text" autocomplete="username" maxlength="24" required placeholder="3–24 letters, numbers, . _ -">
        </label>
        <label class="auth-label">Password
          <input class="auth-input" id="authPass" type="password" autocomplete="current-password" maxlength="200" required placeholder="At least 8 characters">
        </label>
        <button class="ui-btn ui-btn-primary ui-btn-block" id="authSubmit" type="submit">Sign in</button>
      </form>
      <p class="auth-note">Your progress is saved for at least 3 years.</p>
    </div>
  </div>

  <div class="ui-toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/providers.js"></script>
  <script src="js/art.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/tutor.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/views.js"></script>
  <script src="js/views3.js"></script>
  <script src="js/views4.js"></script>
  <script src="js/views5.js"></script>
  <script src="js/views6.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
